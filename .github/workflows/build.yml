name: Build FlovexSpawn

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build plugin
        run: gradle clean build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: FlovexSpawn-1.0.0
          path: build/libs/FlovexSpawn-1.0.0.jar
